[project]
name = "fl-mammo"
version = "0.1.0"
description = "Federated mammography classification benchmark across four hospital sites"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter or comments)
    "E402",  # module level import not at top of file (used for path setup)
    "E741",  # ambiguous variable name
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

